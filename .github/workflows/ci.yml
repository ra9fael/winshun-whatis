name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validation dependencies
        run: python -m pip install jsonschema==4.23.0
      - name: Configure
        run: cmake -S . -B build/ci -A x64
      - name: Build
        run: cmake --build build/ci --config Release --parallel
      - name: Core and native tests
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            python tools/package.py --tag $env:REF_NAME --out dist/ci
          } else {
            python tools/package.py --out dist/ci
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate manifest, docs and package
        run: python tests/validate.py --package-dir dist/ci --out build/ci/static.json
      - uses: actions/upload-artifact@v4
        with:
          name: whatis-windows-x64
          path: |
            dist/ci/
            build/ci/static.json
          if-no-files-found: error
